<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位置选择器 - 28星宿天体音乐生成器</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0c0c1e 0%, #1a1a3e 50%, #2d2d5f 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .step.completed {
            background: linear-gradient(45deg, #4ade80, #22c55e);
            color: white;
        }

        .step.active {
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            color: white;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .step.inactive {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
        }

        .step-line {
            width: 60px;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
        }

        .step-line.completed {
            background: linear-gradient(90deg, #4ade80, #22c55e);
        }

        #earthCanvas {

            border-radius: 50%;
            cursor: grab;
            transition: transform 0.3s ease;
        }

        #earthCanvas:active {
            cursor: grabbing;
        }

        #earthCanvas:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }

        .city-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 8px 16px;
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .city-btn:hover {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }

        .city-btn.selected {
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            border-color: #3b82f6;
        }

        .coord-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin: 8px 0;
            border-left: 3px solid #3b82f6;
        }

        .btn-primary {
            background: linear-gradient(45deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 20px;
            }

            .glass-panel {
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>
    <!-- 星空背景 -->
    <div class="stars" id="stars"></div>

    <div class="relative z-10 min-h-screen flex flex-col">
        <!-- 步骤指示器 -->
        <div class="step-indicator mt-8">
            <div class="step completed">1</div>
            <div class="step-line completed"></div>
            <div class="step active">2</div>
            <div class="step-line inactive"></div>
            <div class="step inactive">3</div>
            <div class="step-line inactive"></div>
            <div class="step inactive">4</div>
        </div>

        <!-- 标题 -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">选择观测位置</h1>
            <p class="text-gray-300">在地球上选择您的观测位置 | 滚轮缩放地球</p>
        </div>

        <!-- 主要内容区域 -->
        <div class="flex-1 flex justify-center items-start px-8">
            <div class="container flex gap-8 max-w-7xl w-full">
                <!-- 左侧面板 -->
                <div class="glass-panel p-6 w-80">
                    <!-- 已选择时间 -->
                    <div class="mb-6">
                        <div class="flex items-center mb-3">
                            <i class="fas fa-clock text-blue-400 mr-2"></i>
                            <span class="text-white font-semibold">已选择时间</span>
                        </div>
                        <div class="bg-gray-800 rounded-lg p-3">
                            <div class="text-white font-mono" id="selectedTime">加载中...</div>
                            <div class="text-gray-400 text-sm mt-1" id="timeDetails">等待数据加载</div>
                        </div>
                    </div>

                    <!-- 快速选择 -->
                    <div class="mb-6">
                        <div class="flex items-center mb-3">
                            <i class="fas fa-map-marker-alt text-blue-400 mr-2"></i>
                            <span class="text-white font-semibold">快速选择</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button class="city-btn" data-city="beijing">北京</button>
                            <button class="city-btn" data-city="shanghai">上海</button>
                            <button class="city-btn" data-city="guangzhou">广州</button>
                            <button class="city-btn" data-city="shenzhen">深圳</button>
                            <button class="city-btn" data-city="hongkong">香港</button>
                            <button class="city-btn" data-city="taipei">台北</button>
                            <button class="city-btn" data-city="newyork">纽约</button>
                            <button class="city-btn" data-city="london">伦敦</button>
                            <button class="city-btn" data-city="tokyo">东京</button>
                            <button class="city-btn" data-city="paris">巴黎</button>
                            <button class="city-btn" data-city="sydney">悉尼</button>
                            <button class="city-btn" data-city="singapore">新加坡</button>
                        </div>
                    </div>

                    <!-- 获取当前位置 -->
                    <button class="btn-secondary mb-4" id="getCurrentLocation">
                        <i class="fas fa-location-arrow mr-2"></i>
                        获取当前位置
                    </button>
                </div>

                <!-- 中央地球 -->
                <div class="glass-panel p-6 flex-1">
                    <div class="flex items-center justify-center mb-4">
                        <i class="fas fa-globe text-blue-400 mr-2"></i>
                        <span class="text-white font-semibold">地球选择器</span>
                    </div>

                    <div class="flex justify-center">
                        <canvas id="earthCanvas" width="400" height="400"></canvas>
                    </div>

                    <div class="text-center mt-4">
                        <p class="text-gray-300 text-sm">点击并拖拽地球来旋转视角</p>
                        <p class="text-gray-400 text-xs">点击地球表面选择位置 | 滚轮缩放</p>
                    </div>
                </div>

                <!-- 右侧面板 -->
                <div class="glass-panel p-6 w-80">
                    <!-- 当前位置 -->
                    <div class="mb-6">
                        <div class="flex items-center mb-3">
                            <i class="fas fa-crosshairs text-yellow-400 mr-2"></i>
                            <span class="text-white font-semibold">当前位置</span>
                        </div>
                    </div>

                    <!-- 坐标显示 -->
                    <div class="coord-display">
                        <div class="text-gray-300 text-sm">经度 (Longitude):</div>
                        <div class="text-white font-mono text-lg" id="longitude">114.0579°E</div>
                    </div>

                    <div class="coord-display">
                        <div class="text-gray-300 text-sm">纬度 (Latitude):</div>
                        <div class="text-white font-mono text-lg" id="latitude">22.5431°N</div>
                    </div>

                    <div class="coord-display">
                        <div class="text-gray-300 text-sm">地点</div>
                        <div class="text-white" id="locationName">深圳</div>
                    </div>

                    <div class="coord-display">
                        <div class="text-gray-300 text-sm">缩放级别</div>
                        <div class="text-blue-400" id="zoomLevel">1.0x</div>
                    </div>

                    <div class="coord-display">
                        <div class="text-gray-300 text-sm">状态</div>
                        <div class="text-green-400" id="locationStatus">
                            <i class="fas fa-check-circle mr-1"></i>
                            位置已选择
                        </div>
                    </div>

                    <!-- 操作按钮 -->
                    <div class="mt-8">
                        <button class="btn-primary" id="confirmLocation">
                            <i class="fas fa-arrow-right mr-2"></i>
                            进入天球坐标
                        </button>
                        <button class="btn-secondary" id="goBackToTime">
                            <i class="fas fa-arrow-left mr-2"></i>
                            返回时间选择
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let canvas, ctx;
        let earthRadius = 180;
        let rotation = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        let isAnimating = false;
        let animationSpeed = 0.08;
        let isDragging = false;
        let lastMousePos = { x: 0, y: 0 };
        let selectedLocation = { lat: 22.5431, lng: 114.0579, name: "深圳", country: "中国" };

        // 🎯 新增：缩放相关变量
        let zoomLevel = 1;
        const minZoom = 0.5;
        const maxZoom = 4;

        // 在全局变量部分添加
        let earthTexture = null;
        let isTextureLoaded = false;
        let textureDataCache = null;

        // 城市数据
        const cities = {
            beijing: { lat: 39.9042, lng: 116.4074, name: "北京", country: "中国" },
            shanghai: { lat: 31.2304, lng: 121.4737, name: "上海", country: "中国" },
            guangzhou: { lat: 23.1291, lng: 113.2644, name: "广州", country: "中国" },
            shenzhen: { lat: 22.5431, lng: 114.0579, name: "深圳", country: "中国" },
            hongkong: { lat: 22.3193, lng: 114.1694, name: "香港", country: "中国香港" },
            taipei: { lat: 25.0330, lng: 121.5654, name: "台北", country: "中国台湾" },
            newyork: { lat: 40.7128, lng: -74.0060, name: "纽约", country: "美国" },
            london: { lat: 51.5074, lng: -0.1278, name: "伦敦", country: "英国" },
            tokyo: { lat: 35.6762, lng: 139.6503, name: "东京", country: "日本" },
            paris: { lat: 48.8566, lng: 2.3522, name: "巴黎", country: "法国" },
            sydney: { lat: -33.8688, lng: 151.2093, name: "悉尼", country: "澳大利亚" },
            singapore: { lat: 1.3521, lng: 103.8198, name: "新加坡", country: "新加坡" }
        };

        // 初始化时加载地球纹理
        function loadEarthTexture() {
            earthTexture = new Image();
            earthTexture.crossOrigin = 'anonymous';
            earthTexture.onload = function () {
                isTextureLoaded = true;
                drawEarth(); // 重新绘制
            };
            earthTexture.src = 'https://raw.githubusercontent.com/mingo-wu1/forpic_test/main/earth_atmos_2048_3.png';
        }

        // 初始化
        function init() {
            createStars();
            initCanvas();
            loadEarthTexture();
            loadSelectedTime();
            updateLocationDisplay();
            bindEvents();
            drawEarth();
        }

        // 创建星空背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // 初始化Canvas
        function initCanvas() {
            canvas = document.getElementById('earthCanvas');
            ctx = canvas.getContext('2d');

            // 设置高DPI支持
            const dpr = window.devicePixelRatio || 1;
            canvas.width = 400 //* dpr;
            canvas.height = 400 //* dpr;
            canvas.style.width = '400px';
            canvas.style.height = '400px';
            // ctx.scale(dpr, dpr);
        }

        // 加载已选择的时间
        function loadSelectedTime() {
            try {
                const timeData = JSON.parse(sessionStorage.getItem('selectedTime'));
                if (timeData) {
                    document.getElementById('selectedTime').textContent =
                        `${timeData.year}年${timeData.month}月${timeData.day}日 ${timeData.hour}:00`;
                    document.getElementById('timeDetails').textContent =
                        `时间戳: ${timeData.year}-${String(timeData.month).padStart(2, '0')}-${String(timeData.day).padStart(2, '0')}T${String(timeData.hour).padStart(2, '0')}:00:00Z`;
                } else {
                    document.getElementById('selectedTime').textContent = '未选择时间';
                    document.getElementById('timeDetails').textContent = '请先选择时间';
                }
            } catch (e) {
                console.error('加载时间数据失败:', e);
            }
        }

        // 🎯 更新位置显示 - 新增缩放级别显示
        function updateLocationDisplay() {
            const lngText = selectedLocation.lng >= 0 ?
                `${selectedLocation.lng.toFixed(4)}°E` :
                `${Math.abs(selectedLocation.lng).toFixed(4)}°W`;
            const latText = selectedLocation.lat >= 0 ?
                `${selectedLocation.lat.toFixed(4)}°N` :
                `${Math.abs(selectedLocation.lat).toFixed(4)}°S`;

            document.getElementById('longitude').textContent = lngText;
            document.getElementById('latitude').textContent = latText;
            document.getElementById('locationName').textContent = selectedLocation.name;
            document.getElementById('zoomLevel').textContent = `${zoomLevel.toFixed(1)}x`;
        }

        // 绑定事件
        function bindEvents() {
            // 城市按钮事件
            document.querySelectorAll('.city-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    console.log('🎯 按钮被点击:', btn.dataset.city);
                    const cityKey = btn.dataset.city;
                    selectCity(cityKey);

                    // 更新按钮状态
                    document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
            });

            // Canvas鼠标事件
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('mouseleave', handleMouseUp);
            canvas.addEventListener('click', handleCanvasClick);

            // 🎯 新增：滚轮缩放事件
            canvas.addEventListener('wheel', handleWheel, { passive: false });

            // 触摸事件
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd);

            // 获取当前位置
            document.getElementById('getCurrentLocation').addEventListener('click', getCurrentLocation);

            // 确认位置
            document.getElementById('confirmLocation').addEventListener('click', confirmLocation);

            // 返回时间选择
            document.getElementById('goBackToTime').addEventListener('click', () => {
                window.location.href = '/';
            });
        }

        // 🎯 新增：滚轮缩放处理
        function handleWheel(e) {
            e.preventDefault();

            const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            const newZoom = zoomLevel * zoomFactor;

            // 限制缩放范围
            zoomLevel = Math.max(minZoom, Math.min(maxZoom, newZoom));

            updateLocationDisplay(); // 更新缩放级别显示
            drawEarth(); // 重新绘制
        }

        // 选择城市
        function selectCity(cityKey) {
            if (cities[cityKey]) {
                console.log('🎯 城市数据:', cities[cityKey]);
                selectedLocation = { ...cities[cityKey] };
                console.log('🎯 selectedLocation设置为:', selectedLocation);
                updateLocationDisplay();
                console.log('🎯 即将调用animateToCity');
                animateToCity(selectedLocation.lat, selectedLocation.lng);
            }
        }

        // 优化版城市动画跳转
        function animateToCity(targetLat, targetLng) {
            console.log('🎯 动画函数被调用:', targetLat, targetLng);

            // 🎯 目标：让红点投影到地球中心 (200, 200)
            const earthCenterX = 200;
            const earthCenterY = 200;

            // 🎯 迭代计算，让红点精确居中
            let bestRotationY = -(targetLng * Math.PI / 180);
            let bestRotationX = 0;

            // 多次迭代优化
            for (let i = 0; i < 10; i++) {
                // 临时设置旋转
                let tempRotation = { x: bestRotationX, y: bestRotationY };

                // 计算在这个旋转下，目标点会投影到哪里
                const projected = calculateProjection(targetLat, targetLng, tempRotation);

                if (projected && projected.visible) {
                    // 计算偏差
                    const deltaX = projected.x - earthCenterX;
                    const deltaY = projected.y - earthCenterY;

                    // 如果偏差很小，就停止迭代
                    if (Math.abs(deltaX) < 2 && Math.abs(deltaY) < 2) {
                        break;
                    }

                    // 🎯 根据偏差调整旋转角度
                    bestRotationY -= deltaX * 0.005; // 调整经度旋转
                } else {
                    // 🎯 关键修复：如果红点不可见，调整为可见
                    bestRotationY = -(targetLng * Math.PI / 180);
                    bestRotationX = 0; // 重置纬度旋转，让红点回到可见面
                    break; // 停止迭代，使用基本可见位置
                }
            }

            // 设置最终的目标旋转角度
            targetRotation.y = bestRotationY;
            targetRotation.x = bestRotationX;

            // 限制X轴旋转范围
            targetRotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetRotation.x));

            // 开始动画
            isAnimating = true;
            console.log('🎯 设置目标旋转角度:', targetRotation.y, targetRotation.x);

            animateRotation();
        }

        // 🎯 新增：计算投影位置的辅助函数
        function calculateProjection(lat, lng, rotation) {
            const latRad = lat * Math.PI / 180;
            const lngRad = lng * Math.PI / 180;

            // 球面坐标
            let x = Math.cos(latRad) * Math.sin(lngRad);
            let y = Math.sin(latRad);
            let z = Math.cos(latRad) * Math.cos(lngRad);

            // 应用旋转
            const cosX = Math.cos(rotation.x);
            const sinX = Math.sin(rotation.x);
            const y1 = y * cosX - z * sinX;
            const z1 = y * sinX + z * cosX;

            const cosY = Math.cos(rotation.y);
            const sinY = Math.sin(rotation.y);
            const x2 = x * cosY + z1 * sinY;
            const z2 = -x * sinY + z1 * cosY;

            // 检查是否在可见半球
            if (z2 < 0) return { visible: false };

            // 🎯 使用缩放后的半径投影到2D
            const currentRadius = earthRadius * zoomLevel;
            const screenX = 200 + x2 * currentRadius;
            const screenY = 200 - y1 * currentRadius;

            return {
                x: screenX,
                y: screenY,
                visible: true
            };
        }

        // 动画循环函数
        function animateRotation() {
            if (!isAnimating) return;

            // 计算当前旋转与目标旋转的差值
            const diffY = targetRotation.y - rotation.y;
            const diffX = targetRotation.x - rotation.x;

            // 处理角度跨越-π到π的情况
            let adjustedDiffY = diffY;
            if (Math.abs(diffY) > Math.PI) {
                adjustedDiffY = diffY > 0 ? diffY - 2 * Math.PI : diffY + 2 * Math.PI;
            }

            // 检查是否足够接近目标
            if (Math.abs(adjustedDiffY) < 0.01 && Math.abs(diffX) < 0.01) {
                rotation.y = targetRotation.y;
                rotation.x = targetRotation.x;
                isAnimating = false;
                console.log('🎯 动画完成');
                drawEarth();
                return;
            }

            // 平滑插值
            rotation.y += adjustedDiffY * animationSpeed;
            rotation.x += diffX * animationSpeed;

            // 重绘地球
            drawEarth();

            // 继续动画
            requestAnimationFrame(animateRotation);
        }

        // 鼠标事件处理
        function handleMouseDown(e) {
            isDragging = true;
            isAnimating = false; // 停止动画
            const rect = canvas.getBoundingClientRect();
            lastMousePos = {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function handleMouseMove(e) {
            if (!isDragging) return;

            isAnimating = false; // 确保拖拽时停止动画

            const rect = canvas.getBoundingClientRect();
            const currentPos = {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };

            const deltaX = currentPos.x - lastMousePos.x;
            const deltaY = currentPos.y - lastMousePos.y;

            rotation.y += deltaX * 0.01;
            rotation.x -= deltaY * 0.01;

            // 限制X轴旋转
            rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotation.x));

            lastMousePos = currentPos;
            drawEarth();
        }

        function handleMouseUp() {
            isDragging = false;
        }

        // 触摸事件处理
        function handleTouchStart(e) {
            e.preventDefault();
            isAnimating = false; // 停止动画
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            isDragging = true;
            lastMousePos = {
                x: touch.clientX - rect.left,
                y: touch.clientY - rect.top
            };
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDragging) return;

            isAnimating = false; // 确保触摸时停止动画

            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const currentPos = {
                x: touch.clientX - rect.left,
                y: touch.clientY - rect.top
            };

            const deltaX = currentPos.x - lastMousePos.x;
            const deltaY = currentPos.y - lastMousePos.y;

            rotation.y += deltaX * 0.01;
            rotation.x -= deltaY * 0.01;

            rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotation.x));

            lastMousePos = currentPos;
            drawEarth();
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            isDragging = false;
        }

        // 🎯 Canvas点击事件 - 修复缩放版本
        function handleCanvasClick(e) {
            if (isDragging) return; // 如果正在拖拽，不处理点击

            const rect = canvas.getBoundingClientRect();

            // 修复DPI缩放问题 - 关键修复
            const dpr = window.devicePixelRatio || 1;
            const scaleX = 400 / rect.width;  // 使用逻辑宽度400，不是物理宽度
            const scaleY = 400 / rect.height; // 使用逻辑高度400，不是物理高度

            const x = (e.clientX - rect.left) * scaleX - 200; // 减去中心点偏移
            const y = (e.clientY - rect.top) * scaleY - 200;

            console.log('点击坐标:', {
                clientX: e.clientX - rect.left,
                clientY: e.clientY - rect.top,
                transformedX: x,
                transformedY: y
            }); // 调试信息

            // 🎯 使用缩放后的半径检测点击
            const currentRadius = earthRadius * zoomLevel;
            const distance = Math.sqrt(x * x + y * y);

            if (distance <= currentRadius) {
                const coords = getLatLngFromClick(x, y);
                if (coords) {
                    selectedLocation = {
                        lat: coords.lat,
                        lng: coords.lng,
                        name: "自定义位置",
                        country: "未知"
                    };
                    updateLocationDisplay();
                    drawEarth();

                    // 取消城市按钮选择
                    document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('selected'));

                    console.log('计算出的经纬度:', coords); // 调试用
                }
            }
        }

        // 🎯 从点击位置计算经纬度 - 修复缩放版本
        function getLatLngFromClick(x, y) {
            const currentRadius = earthRadius * zoomLevel; // 🎯 使用缩放后的半径
            const distance = Math.sqrt(x * x + y * y);
            if (distance > currentRadius) return null;

            // 🎯 使用缩放后的半径进行归一化
            const normalizedX = x / currentRadius;
            const normalizedY = -y / currentRadius; // Y轴翻转
            const normalizedZ = Math.sqrt(Math.max(0, 1 - normalizedX * normalizedX - normalizedY * normalizedY));

            console.log('球面坐标:', { normalizedX, normalizedY, normalizedZ }); // 调试

            // 应用逆旋转变换（与projectPoint中的旋转相反）
            const cosX = Math.cos(rotation.x);
            const sinX = Math.sin(rotation.x);
            const cosY = Math.cos(rotation.y);
            const sinY = Math.sin(rotation.y);

            // 逆旋转：先逆Y轴旋转，再逆X轴旋转
            const x1 = normalizedX * cosY - normalizedZ * sinY;
            const z1 = normalizedX * sinY + normalizedZ * cosY;
            const y1 = normalizedY * cosX + z1 * sinX;
            const z2 = -normalizedY * sinX + z1 * cosX;

            console.log('逆旋转后:', { x1, y1, z2 }); // 调试

            // 转换为经纬度
            const lat = Math.asin(Math.max(-1, Math.min(1, y1))) * 180 / Math.PI;
            const lng = Math.atan2(x1, z2) * 180 / Math.PI;

            console.log('计算的经纬度:', { lat, lng }); // 调试

            return { lat, lng };
        }

        // 获取当前位置
        function getCurrentLocation() {
            if (!navigator.geolocation) {
                alert('您的浏览器不支持地理位置获取');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    selectedLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        name: "当前位置",
                        country: "未知"
                    };
                    updateLocationDisplay();
                    animateToCity(selectedLocation.lat, selectedLocation.lng);

                    document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('selected'));
                },
                (error) => {
                    console.error('获取位置失败:', error);
                    alert('无法获取当前位置，请检查位置权限设置');
                }
            );
        }

        // 🎯 绘制地球 - 修复缩放版本
        function drawEarth() {
            ctx.clearRect(0, 0, 400, 400);

            const centerX = 200;
            const centerY = 200;
            const currentRadius = earthRadius * zoomLevel; // 🎯 使用缩放后的半径

            if (!isTextureLoaded) {
                // 加载中显示
                ctx.fillStyle = '#4682B4';
                ctx.beginPath();
                ctx.arc(centerX, centerY, currentRadius, 0, 2 * Math.PI);
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('加载地球纹理中...', centerX, centerY);
                return;
            }

            // 🎯 创建球体遮罩 - 使用缩放后的半径
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, currentRadius, 0, 2 * Math.PI);
            ctx.clip();

            // 优化1：缓存纹理数据，避免重复创建临时canvas
            if (!textureDataCache) {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = earthTexture.width;
                tempCanvas.height = earthTexture.height;
                tempCtx.drawImage(earthTexture, 0, 0);
                textureDataCache = tempCtx.getImageData(0, 0, earthTexture.width, earthTexture.height);
            }

            const imageSize = Math.ceil(currentRadius * 2); // 使用缩放后的实际尺寸
            const imageData = ctx.createImageData(imageSize, imageSize); // 🎯 关键修复：使用 imageSize 而不是 currentRadius * 2
            const data = imageData.data;

            // 优化2：预计算旋转矩阵
            const cosX = Math.cos(rotation.x);
            const sinX = Math.sin(rotation.x);
            const cosY = Math.cos(rotation.y);
            const sinY = Math.sin(rotation.y);

            // 优化3：减少采样密度，每隔一个像素计算一次，然后填充周围像素
            const step = currentRadius > 200 ? (currentRadius > 300 ? 4 : 2) : 1//2; // 采样步长，可以调整为1（最高质量）到3（最快速度）

            for (let y = 0; y < imageSize; y += step) {
                for (let x = 0; x < imageSize; x += step) {
                    const dx = x - currentRadius;
                    const dy = y - currentRadius;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance <= currentRadius) {
                        // 🎯 计算球面坐标 - 使用缩放后的半径
                        const nx = dx / currentRadius;
                        const ny = dy / currentRadius;
                        const nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));

                        // 优化4：使用预计算的旋转矩阵
                        const x1 = nx * cosY - nz * sinY;
                        const z1 = nx * sinY + nz * cosY;
                        const y1 = ny * cosX - z1 * sinX;
                        const z2 = ny * sinX + z1 * cosX;

                        // 转换为经纬度
                        const lat = Math.asin(Math.max(-1, Math.min(1, y1)));
                        const lng = Math.atan2(x1, z2);

                        // 映射到纹理坐标
                        const textureX = Math.floor(((lng + Math.PI) / (2 * Math.PI)) * earthTexture.width) % earthTexture.width;
                        const textureY = Math.floor(((Math.PI / 2 - lat) / Math.PI) * earthTexture.height);

                        if (textureX >= 0 && textureX < earthTexture.width &&
                            textureY >= 0 && textureY < earthTexture.height) {

                            const textureIndex = (textureY * earthTexture.width + textureX) * 4;

                            // 获取颜色值
                            const r = textureDataCache.data[textureIndex];
                            const g = textureDataCache.data[textureIndex + 1];
                            const b = textureDataCache.data[textureIndex + 2];

                            // 添加光照效果
                            const lightIntensity = Math.max(0.3, (nz + 1) / 2);
                            const finalR = r * lightIntensity;
                            const finalG = g * lightIntensity;
                            const finalB = b * lightIntensity;

                            // 优化5：填充采样区域，减少重复计算
                            // for (let sy = 0; sy < step && y + sy < currentRadius * 2; sy++) {
                            //     for (let sx = 0; sx < step && x + sx < currentRadius * 2; sx++) {
                            //         const imageIndex = ((y + sy) * currentRadius * 2 + (x + sx)) * 4;
                            for (let sy = 0; sy < step && y + sy < imageSize; sy++) {
                                for (let sx = 0; sx < step && x + sx < imageSize; sx++) {
                                    const imageIndex = ((y + sy) * imageSize + (x + sx)) * 4; // 🎯 使用 imageSize
                                    data[imageIndex] = finalR;
                                    data[imageIndex + 1] = finalG;
                                    data[imageIndex + 2] = finalB;
                                    data[imageIndex + 3] = 255;
                                }
                            }
                        }
                    }
                }
            }

            ctx.putImageData(imageData, centerX - imageSize / 2, centerY - imageSize / 2);

            ctx.restore();

            // 优化6：简化经纬网格绘制
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 0.5;

            // 经线 - 减少采样点
            for (let lng = -180; lng <= 180; lng += 30) {
                ctx.beginPath();
                let first = true;
                for (let lat = -90; lat <= 90; lat += 10) { // 从5度改为10度
                    const projected = projectPoint(lat, lng);
                    if (projected && projected.visible) {
                        if (first) {
                            ctx.moveTo(projected.x, projected.y);
                            first = false;
                        } else {
                            ctx.lineTo(projected.x, projected.y);
                        }
                    }
                }
                ctx.stroke();
            }

            // 纬线 - 减少采样点
            for (let lat = -60; lat <= 60; lat += 30) {
                ctx.beginPath();
                let first = true;
                for (let lng = -180; lng <= 180; lng += 10) { // 从5度改为10度
                    const projected = projectPoint(lat, lng);
                    if (projected && projected.visible) {
                        if (first) {
                            ctx.moveTo(projected.x, projected.y);
                            first = false;
                        } else {
                            ctx.lineTo(projected.x, projected.y);
                        }
                    }
                }
                ctx.stroke();
            }

            // 绘制选中位置
            const selectedProjected = projectPoint(selectedLocation.lat, selectedLocation.lng);
            if (selectedProjected && selectedProjected.visible) {
                ctx.shadowColor = '#FF4444';
                ctx.shadowBlur = 15;

                ctx.fillStyle = '#FF4444';
                ctx.beginPath();
                ctx.arc(selectedProjected.x, selectedProjected.y, 8, 0, 2 * Math.PI);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 位置标签
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(selectedLocation.name, selectedProjected.x, selectedProjected.y - 15);
            }

            // 🎯 地球边缘高光 - 使用缩放后的半径
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, currentRadius, 0, 2 * Math.PI);
            ctx.stroke();
        }

        // 🎯 投影点到2D平面 - 修复缩放版本
        function projectPoint(lat, lng) {
            const latRad = lat * Math.PI / 180;
            const lngRad = lng * Math.PI / 180;

            // 球面坐标
            let x = Math.cos(latRad) * Math.sin(lngRad);
            let y = Math.sin(latRad);
            let z = Math.cos(latRad) * Math.cos(lngRad);

            // 应用旋转
            const cosX = Math.cos(rotation.x);
            const sinX = Math.sin(rotation.x);
            const y1 = y * cosX - z * sinX;
            const z1 = y * sinX + z * cosX;

            const cosY = Math.cos(rotation.y);
            const sinY = Math.sin(rotation.y);
            const x2 = x * cosY + z1 * sinY;
            const z2 = -x * sinY + z1 * cosY;

            // 检查是否在可见半球
            if (z2 < 0) return { visible: false };

            // 🎯 投影到2D - 使用缩放后的半径
            const currentRadius = earthRadius * zoomLevel;
            const screenX = 200 + x2 * currentRadius;
            const screenY = 200 - y1 * currentRadius;

            return {
                x: screenX,
                y: screenY,
                visible: true
            };
        }

        // 确认位置选择
        function confirmLocation() {
            try {
                const timeData = JSON.parse(sessionStorage.getItem('selectedTime'));
                if (!timeData) {
                    alert('请先选择时间');
                    window.location.href = '/';
                    return;
                }

                const locationData = {
                    latitude: selectedLocation.lat,
                    longitude: selectedLocation.lng,
                    address: selectedLocation.name,
                    country: selectedLocation.country
                };

                // 保存位置数据
                sessionStorage.setItem('selectedLocation', JSON.stringify(locationData));

                // 跳转到星图页面
                window.location.href = '/sphere';
            } catch (e) {
                console.error('保存位置数据失败:', e);
                alert('保存位置数据失败，请重试');
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
