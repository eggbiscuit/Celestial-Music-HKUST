<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>二十八星宿星图 - 28 Mansions Celestial Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ==================== CSS Variables ==================== */
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #1a1d2e;
            --color-gold: #d4af37;
            --color-cyan: #00ffff;
            --color-blue: #4facfe;
            --color-red: #ff6b6b;
            --color-white: #ffffff;
            --color-gray: #a8a8a8;

            /* Safe area for notch screens */
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-left: env(safe-area-inset-left, 0px);
            --safe-area-right: env(safe-area-inset-right, 0px);
        }

        /* ==================== Base Styles ==================== */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1d2e 50%, #0d1117 100%);
            color: #e0e0e0;
            overflow-x: hidden;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ==================== Layout Grid ==================== */
        .main-container {
            display: grid;
            grid-template-areas:
                "header"
                "starmap"
                "controls"
                "info"
                "player";
            grid-template-rows: auto 65vh auto auto auto;
            min-height: 100vh;
            min-height: 100dvh;
            padding-top: var(--safe-area-top);
            padding-bottom: var(--safe-area-bottom);
        }

        /* Desktop layout */
        @media (min-width: 768px) {
            .main-container {
                grid-template-areas:
                    "header header header"
                    "controls starmap info"
                    "player player player";
                grid-template-columns: 280px 1fr 320px;
                grid-template-rows: auto 1fr auto;
                gap: 1rem;
                padding: 1rem;
                max-width: 1920px;
                margin: 0 auto;
            }
        }

        /* ==================== Header (Step Navigation) ==================== */
        .step-nav {
            grid-area: header;
            display: flex;
            justify-content: space-around;
            padding: 0.5rem;
            background: rgba(26, 29, 46, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            gap: 0.25rem;
            position: sticky;
            top: var(--safe-area-top);
            z-index: 100;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            padding: 0.5rem 0.25rem;
            flex: 1;
            min-width: 0;
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .step-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid var(--color-gold);
            font-size: 14px;
            font-weight: 700;
            color: var(--color-gold);
            transition: all 0.3s ease;
        }

        .step-item.active .step-number {
            background: var(--color-gold);
            color: #0a0e1a;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        .step-label {
            font-size: 11px;
            color: #999;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .step-item.active .step-label {
            color: var(--color-gold);
            font-weight: 600;
        }

        /* Hide step labels on very small screens */
        @media (max-width: 380px) {
            .step-label {
                display: none;
            }
            .step-number {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }

        @media (min-width: 768px) {
            .step-nav {
                padding: 1rem;
                gap: 1rem;
            }
            .step-item {
                padding: 0.75rem;
            }
            .step-number {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            .step-label {
                font-size: 13px;
            }
        }

        /* ==================== Starmap Section ==================== */
        .starmap-container {
            grid-area: starmap;
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            min-height: 300px;
        }

        .starmap-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .starmap-hint {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 12px;
            color: var(--color-cyan);
            pointer-events: none;
            opacity: 0.8;
            animation: pulse 2s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @media (min-width: 768px) {
            .starmap-container {
                min-height: 600px;
            }
            .starmap-hint {
                font-size: 14px;
                padding: 0.75rem 1.5rem;
            }
        }

        /* ==================== Collapsible Panels ==================== */
        .panel {
            background: rgba(26, 29, 46, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            overflow: hidden;
            margin: 0.5rem;
        }

        .panel-header {
            padding: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(212, 175, 55, 0.05);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.2s ease;
            min-height: 56px; /* Ensure 44px+ touch target */
        }

        .panel-header:active {
            background: rgba(212, 175, 55, 0.15);
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-gold);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-toggle {
            font-size: 20px;
            color: var(--color-gold);
            transition: transform 0.3s ease;
        }

        details[open] .panel-toggle {
            transform: rotate(180deg);
        }

        .panel-content {
            padding: 1rem;
        }

        @media (min-width: 768px) {
            .panel {
                margin: 0;
            }
            /* Desktop: always show panels */
            details {
                display: block !important;
            }
            details summary {
                pointer-events: none;
            }
            details .panel-toggle {
                display: none;
            }
        }

        /* ==================== Controls Section ==================== */
        .controls-section {
            grid-area: controls;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: #999;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            transition: all 0.3s ease;
            min-height: 44px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        /* Duration preset buttons */
        .duration-presets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .preset-btn {
            padding: 0.625rem 0.5rem;
            background: rgba(74, 172, 254, 0.1);
            border: 1px solid var(--color-blue);
            border-radius: 6px;
            color: var(--color-blue);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preset-btn:hover, .preset-btn:active {
            background: rgba(74, 172, 254, 0.2);
            transform: translateY(-1px);
        }

        /* Action buttons */
        .btn-primary {
            width: 100%;
            padding: 0.875rem 1rem;
            background: linear-gradient(135deg, var(--color-gold) 0%, #b8932d 100%);
            border: none;
            border-radius: 8px;
            color: #0a0e1a;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
            min-height: 48px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(212, 175, 55, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--color-cyan);
            border-radius: 8px;
            color: var(--color-cyan);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 44px;
        }

        .btn-secondary:hover, .btn-secondary:active {
            background: rgba(0, 255, 255, 0.2);
        }

        /* ==================== Info Section ==================== */
        .info-section {
            grid-area: info;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 3px solid var(--color-gold);
        }

        .info-label {
            font-size: 11px;
            color: #999;
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-size: 14px;
            color: #e0e0e0;
            font-weight: 600;
        }

        /* Mansions grid */
        .mansions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .mansion-tag {
            padding: 0.5rem;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--color-red);
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
            color: var(--color-red);
        }

        .mansion-tag.active {
            background: var(--color-red);
            color: white;
        }

        @media (min-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            .mansions-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ==================== Music Player Section ==================== */
        .player-section {
            grid-area: player;
            position: sticky;
            bottom: var(--safe-area-bottom);
            background: rgba(26, 29, 46, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding: 1rem;
            padding-bottom: calc(1rem + var(--safe-area-bottom));
            z-index: 50;
        }

        .player-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .player-title {
            font-size: 14px;
            color: var(--color-gold);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        audio {
            width: 100%;
            height: 48px;
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }

        .player-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        @media (min-width: 768px) {
            .player-section {
                position: static;
                padding-bottom: 1rem;
            }
            .player-actions {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* ==================== Loading & Status ==================== */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-top-color: var(--color-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-message {
            margin-top: 0.75rem;
            padding: 0.75rem;
            background: rgba(0, 255, 255, 0.1);
            border-left: 3px solid var(--color-cyan);
            border-radius: 6px;
            font-size: 13px;
            color: var(--color-cyan);
        }

        .status-message.error {
            background: rgba(255, 107, 107, 0.1);
            border-left-color: var(--color-red);
            color: var(--color-red);
        }

        .status-message.success {
            background: rgba(80, 250, 123, 0.1);
            border-left-color: #50fa7b;
            color: #50fa7b;
        }

        /* ==================== Checkbox Custom Style ==================== */
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--color-gold);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            padding: 0.5rem 0;
            min-height: 44px;
        }

        /* ==================== Scrollbar ==================== */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Step Navigation -->
        <nav class="step-nav">
            <div class="step-item active" data-step="1">
                <div class="step-number">1</div>
                <div class="step-label">选择时间</div>
            </div>
            <div class="step-item" data-step="2">
                <div class="step-number">2</div>
                <div class="step-label">选择位置</div>
            </div>
            <div class="step-item" data-step="3">
                <div class="step-number">3</div>
                <div class="step-label">查看星图</div>
            </div>
            <div class="step-item" data-step="4">
                <div class="step-number">4</div>
                <div class="step-label">生成音乐</div>
            </div>
        </nav>

        <!-- Starmap Display -->
        <div class="starmap-container">
            <iframe id="stellarium-iframe" src="stellarium_web_engine.html"></iframe>
            <div class="starmap-hint">触摸拖动以旋转星图 / 双指缩放</div>
        </div>

        <!-- Controls Panel -->
        <div class="controls-section">
            <details class="panel" open>
                <summary class="panel-header">
                    <div class="panel-title">
                        <span>⚙️</span>
                        <span>时间与位置设置</span>
                    </div>
                    <span class="panel-toggle">▼</span>
                </summary>
                <div class="panel-content">
                    <!-- Time Selection -->
                    <div class="form-group">
                        <label class="form-label">选择观测时间</label>
                        <input
                            type="datetime-local"
                            id="observation-time"
                            class="form-input"
                            value=""
                        >
                    </div>

                    <!-- Location -->
                    <div class="form-group">
                        <label class="form-label">观测位置</label>
                        <input
                            type="text"
                            id="location-display"
                            class="form-input"
                            readonly
                            placeholder="点击下方设置位置"
                        >
                        <button type="button" class="btn-secondary" style="margin-top: 0.5rem;" onclick="openLocationSelector()">
                            选择位置
                        </button>
                    </div>

                    <!-- Update Starmap Button -->
                    <button type="button" class="btn-primary" onclick="updateStarmap()">
                        更新星图
                    </button>

                    <div id="status-message"></div>
                </div>
            </details>

            <!-- Music Generation Panel -->
            <details class="panel">
                <summary class="panel-header">
                    <div class="panel-title">
                        <span>🎵</span>
                        <span>音乐生成设置</span>
                    </div>
                    <span class="panel-toggle">▼</span>
                </summary>
                <div class="panel-content">
                    <div class="form-group">
                        <label class="form-label">音乐时长 (秒)</label>
                        <input
                            type="number"
                            id="music-duration"
                            class="form-input"
                            value="45"
                            min="15"
                            max="180"
                        >
                        <div class="duration-presets">
                            <button type="button" class="preset-btn" onclick="setDuration(15)">15s</button>
                            <button type="button" class="preset-btn" onclick="setDuration(30)">30s</button>
                            <button type="button" class="preset-btn" onclick="setDuration(45)">45s</button>
                            <button type="button" class="preset-btn" onclick="setDuration(60)">60s</button>
                            <button type="button" class="preset-btn" onclick="setDuration(90)">90s</button>
                            <button type="button" class="preset-btn" onclick="setDuration(120)">120s</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="use-lunar" checked>
                            <span class="form-label" style="margin: 0;">使用农历计算</span>
                        </label>
                    </div>

                    <button
                        type="button"
                        class="btn-primary"
                        id="generate-music-btn"
                        onclick="generateMusic()"
                    >
                        生成天体音乐
                    </button>

                    <div id="music-status"></div>
                </div>
            </details>
        </div>

        <!-- Info Panel -->
        <div class="info-section">
            <details class="panel" open>
                <summary class="panel-header">
                    <div class="panel-title">
                        <span>📊</span>
                        <span>天文信息</span>
                    </div>
                    <span class="panel-toggle">▼</span>
                </summary>
                <div class="panel-content">
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">太阳黄经</div>
                            <div class="info-value" id="info-longitude">--</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">十二星次</div>
                            <div class="info-value" id="info-zodiac">--</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">节气</div>
                            <div class="info-value" id="info-solar-term">--</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">五行</div>
                            <div class="info-value" id="info-element">--</div>
                        </div>
                    </div>

                    <div style="margin-top: 1rem;">
                        <div class="form-label">相关星宿</div>
                        <div class="mansions-grid" id="mansions-list">
                            <div class="mansion-tag">角</div>
                            <div class="mansion-tag">亢</div>
                            <div class="mansion-tag">氐</div>
                            <div class="mansion-tag">房</div>
                        </div>
                    </div>
                </div>
            </details>
        </div>

        <!-- Music Player -->
        <div class="player-section" id="music-player-section" style="display: none;">
            <div class="player-container">
                <div class="player-title">生成的天体音乐</div>
                <audio id="music-player" controls>
                    <source id="music-source" src="" type="audio/mpeg">
                    您的浏览器不支持音频播放
                </audio>
                <div class="player-actions">
                    <button type="button" class="btn-secondary" onclick="downloadMusic()">
                        下载音乐
                    </button>
                    <button type="button" class="btn-secondary" onclick="shareMusic()">
                        分享音乐
                    </button>
                    <button type="button" class="btn-secondary" onclick="regenerateMusic()">
                        重新生成
                    </button>
                    <button type="button" class="btn-secondary" onclick="backToSettings()">
                        返回设置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let currentAstronomyData = null;
        let currentMusicUrl = null;
        let selectedLocation = {
            latitude: 22.3193,
            longitude: 114.1694,
            address: "香港科技大学"
        };

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', function() {
            initializeDateTime();
            loadStoredLocation();
            updateLocationDisplay();
        });

        function initializeDateTime() {
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            const localISOTime = new Date(now - offset).toISOString().slice(0, 16);
            document.getElementById('observation-time').value = localISOTime;
        }

        function loadStoredLocation() {
            const stored = localStorage.getItem('selectedLocation');
            if (stored) {
                selectedLocation = JSON.parse(stored);
            }
        }

        function updateLocationDisplay() {
            const display = document.getElementById('location-display');
            if (selectedLocation.address) {
                display.value = `${selectedLocation.address} (${selectedLocation.latitude.toFixed(4)}, ${selectedLocation.longitude.toFixed(4)})`;
            } else {
                display.value = `纬度 ${selectedLocation.latitude.toFixed(4)}, 经度 ${selectedLocation.longitude.toFixed(4)}`;
            }
        }

        function openLocationSelector() {
            window.open('location-selector.html', '_blank');
            // Listen for location updates
            window.addEventListener('storage', function(e) {
                if (e.key === 'selectedLocation') {
                    loadStoredLocation();
                    updateLocationDisplay();
                }
            });
        }

        function setDuration(seconds) {
            document.getElementById('music-duration').value = seconds;
        }

        async function updateStarmap() {
            const timeInput = document.getElementById('observation-time').value;
            if (!timeInput) {
                showStatus('请选择观测时间', 'error');
                return;
            }

            showStatus('正在更新星图...', 'info');
            updateStepProgress(3);

            try {
                const datetime = new Date(timeInput);
                const stellariumIframe = document.getElementById('stellarium-iframe');

                // Update Stellarium with new time and location
                const stellariumUrl = new URL(stellariumIframe.src, window.location.href);
                stellariumUrl.searchParams.set('time', datetime.toISOString());
                stellariumUrl.searchParams.set('lat', selectedLocation.latitude);
                stellariumUrl.searchParams.set('lon', selectedLocation.longitude);

                stellariumIframe.src = stellariumUrl.toString();

                // Fetch astronomy data
                const response = await fetch('/api/astronomy/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        time: {
                            year: datetime.getFullYear(),
                            month: datetime.getMonth() + 1,
                            day: datetime.getDate(),
                            hour: datetime.getHours(),
                            is_lunar: document.getElementById('use-lunar').checked
                        },
                        location: selectedLocation
                    })
                });

                const data = await response.json();
                if (data.success) {
                    currentAstronomyData = data;
                    updateAstronomyInfo(data);
                    showStatus('星图更新成功！', 'success');
                } else {
                    showStatus('获取天文数据失败', 'error');
                }
            } catch (error) {
                console.error('Update starmap error:', error);
                showStatus('更新失败: ' + error.message, 'error');
            }
        }

        function updateAstronomyInfo(data) {
            document.getElementById('info-longitude').textContent =
                data.sun_ecliptic_lon ? data.sun_ecliptic_lon.toFixed(2) + '°' : '--';
            document.getElementById('info-zodiac').textContent =
                data.zodiac_sign || '--';
            document.getElementById('info-solar-term').textContent =
                data.solar_term || '--';
            document.getElementById('info-element').textContent =
                data.element || '--';

            // Update mansions
            const mansionsContainer = document.getElementById('mansions-list');
            if (data.mansions && data.mansions.length > 0) {
                mansionsContainer.innerHTML = data.mansions
                    .map(m => `<div class="mansion-tag">${m}</div>`)
                    .join('');
            }
        }

        async function generateMusic() {
            if (!currentAstronomyData) {
                showMusicStatus('请先更新星图以获取天文数据', 'error');
                return;
            }

            const duration = parseInt(document.getElementById('music-duration').value);
            const btn = document.getElementById('generate-music-btn');

            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> 生成中...';
            showMusicStatus('正在生成音乐，这可能需要1-2分钟...', 'info');
            updateStepProgress(4);

            try {
                const timeInput = document.getElementById('observation-time').value;
                const datetime = new Date(timeInput);

                const response = await fetch('/api/generate_music', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        time_selection: {
                            year: datetime.getFullYear(),
                            month: datetime.getMonth() + 1,
                            day: datetime.getDate(),
                            hour: datetime.getHours(),
                            is_lunar: document.getElementById('use-lunar').checked
                        },
                        location_selection: selectedLocation,
                        duration: duration
                    })
                });

                const data = await response.json();

                if (data.success && data.music_url) {
                    currentMusicUrl = data.music_url;
                    loadMusic(data.music_url);
                    showMusicStatus('音乐生成成功！', 'success');
                } else {
                    showMusicStatus('音乐生成失败: ' + (data.error || '未知错误'), 'error');
                }
            } catch (error) {
                console.error('Generate music error:', error);
                showMusicStatus('生成失败: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '生成天体音乐';
            }
        }

        function loadMusic(url) {
            const player = document.getElementById('music-player');
            const source = document.getElementById('music-source');
            const playerSection = document.getElementById('music-player-section');

            source.src = url;
            player.load();
            playerSection.style.display = 'block';

            // Auto play
            player.play().catch(e => {
                console.log('Auto-play prevented:', e);
            });
        }

        function downloadMusic() {
            if (currentMusicUrl) {
                const a = document.createElement('a');
                a.href = currentMusicUrl;
                a.download = `celestial-music-${Date.now()}.mp3`;
                a.click();
            }
        }

        function shareMusic() {
            if (navigator.share && currentMusicUrl) {
                navigator.share({
                    title: '28星宿天体音乐',
                    text: '我刚刚生成了一首基于中国传统天文学的音乐！',
                    url: currentMusicUrl
                }).catch(err => console.log('Share failed:', err));
            } else {
                alert('您的浏览器不支持分享功能');
            }
        }

        function regenerateMusic() {
            generateMusic();
        }

        function backToSettings() {
            document.getElementById('music-player-section').style.display = 'none';
            updateStepProgress(3);
        }

        function updateStepProgress(step) {
            document.querySelectorAll('.step-item').forEach(item => {
                const stepNum = parseInt(item.dataset.step);
                if (stepNum === step) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status-message');
            statusDiv.className = `status-message ${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
            }
        }

        function showMusicStatus(message, type = 'info') {
            const statusDiv = document.getElementById('music-status');
            statusDiv.className = `status-message ${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
            }
        }

        // Handle location updates from storage events
        window.addEventListener('storage', function(e) {
            if (e.key === 'selectedLocation') {
                loadStoredLocation();
                updateLocationDisplay();
            }
        });
    </script>
</body>
</html>
